<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;border-collapse:separate;">
    <tr>
      <td style="padding:24px 28px 8px;">
        <p style="margin:0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#71717a;font-weight:700;">Contact form</p>
        <h1 style="margin:8px 0 0;font-size:22px;line-height:1.3;">{{.FormName}}</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:8px 28px 24px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
          {{range .Fields}}
          <tr>
            <td style="padding:10px 16px 10px 0;vertical-align:top;width:34%;font-weight:700;color:#3f3f46;border-top:1px solid #e4e4e7;">{{.Label}}</td>
            <td style="padding:10px 0;vertical-align:top;white-space:pre-wrap;border-top:1px solid #e4e4e7;">{{.Value}}</td>
          </tr>
          {{else}}
          <tr>
            <td style="padding:10px 0;color:#71717a;">No fields were submitted.</td>
          </tr>
          {{end}}
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
